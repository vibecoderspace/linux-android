name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-37.2" || true
          sdkmanager --install "build-tools;37.0.0-rc2" || true

      - name: Unit tests
        run: ./gradlew :linux:test --no-daemon

      - name: Assemble sample
        run: ./gradlew :sample:assembleDebug --no-daemon
